<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        //1. 

        let arr = [10, 20, 30, 40, 50];
        let target = 30;
        for (let i = 0; i < arr.length; i++) {
            if (arr[i] === target) {
                console.log(`Found ${target} at index ${i}`);
                break;
            }
        }

        //2.

        for (let i = 1; i <= 15; i++) {
            if (i % 3 === 0) {
                continue;
            }
            console.log(i);
        }

        //3. 
        for (even = 1; even <= 10; even++) {
            if (even % 2 === 1) {
                continue;

            }
            console.log(even);

        }

        //4.

        let items = ["apple", "banana", "cherry", "date"];

        let searchItem = "cherry";

        for (let item of items) {

            if (item === searchItem) {

                console.log(`${searchItem} found!`);

                break;

            }

        }

        //5.

        let numbers = [1, 3, 5, 8, 9];

        for (let num of numbers) {

            if (num % 2 === 0) {

                console.log(`First even number: ${num}`);

                break;

            }

        }

        //6.

        let str = "javascript";

        for (let char of str) {

            if ("aeiou".includes(char)) {

                continue;
            }
            console.log(char);
        }

        //7.

        let array = [1, null, 2, undefined, 3, 4];

        for (let value of array) {

            if (value == null) {

                continue;

            }

            console.log(value);

        }

        //8.

        for (let i = 1; i <= 3; i++) {

            for (let j = 1; j <= 3; j++) {

                if (i === j) {

                    continue;

                }

                console.log(`i=${i}, j=${j}`);

            }

        }

        




    </script>
</body>

</html>
