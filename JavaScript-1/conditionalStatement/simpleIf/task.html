<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        // 1. Check the string is empty and log the message

        let string = "";
        if (string === "") {
            console.log("The string is empty!");
        }

        // 2. Verify if the user is logged in based on the given name

        let angel = true;
        if (angel) {
            console.log("Welcome user!!");
        }

        // 3. check an if condition it will be even means it log a message

        let even = 120;
        if (even % 2 === 0) {
            console.log("The number is even!!");
        }

        // 4. Check if the user is old enough to vote

        let age = 20;
        if (age <= 18) {
            console.log("The user is eligible for voting");
        }

        // 5. Check two numbers are equal

        let a = 5, b = 5;
        if (a === b) {
            console.log("yes! the numbers are equal");
        }

        // 6. check an item it is exist in an array

        let arr = ["apple", "banana", "cherry"];
        if (arr.includes("carrot")) {
            console.log("Carrot is in the list");
        }

        // 7. Verify if the given number is zero

        let zero = 0;
        if (zero === 0) {
            console.log("The given number is zero");
        }

        // 8. Verify if a given value is a number

        let num = 34;
        if (typeof num === "number") {
            console.log("It is a number");

        }

        // 9. Log a message based on a time on a day

        let time = 6;
        if (time <= 12) {
            console.log("Good Morning!");

        }

    </script>
</body>

</html>
