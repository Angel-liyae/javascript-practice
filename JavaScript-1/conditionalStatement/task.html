<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        // 1. Check the number it is greater than and even in nested if...

        let num = 30;
        if (num > 10) {
            if (num % 2 === 0) {
                console.log("The number is greater than 10 and even");
            }
        }

        // 2. Use ternary operator to assign a value....

        let age = 20;
        let message = age >= 18 ? "Minor" : "Adult";
        console.log(message);

        // 3.  Check is a num. is positive, negative, zero using if else if else if .....

        let check = -20;
        if (check >= 0) {
            console.log("The number is positive!");
        } else if (check < 0) {
            console.log("The number is negative!");
        } if (check == 0) {
            console.log("The number is zero!");
        }

        // 4. To check the number is between 10 and 20 using logical operator.....

        let logical = 16;
        if (logical > 10 && logical < 20) {
            console.log("Yes!! the number is between the 10 and 20");
        } else {
            console.log("No!! the number is not between the 10 and 20");

        }

        // 5. 










        // 6. Check if a number is even or odd using an if...else statement...

        let numbers = 55;
        if (numbers % 2 == 0) {
            console.log("The number is even");
        } else {
            console.log(" The number is odd");
        }

        // 7. Check the number is positive in if statement....\

        let num1 = 12;
        if (num1 > 0) {
            console.log("The number is positive!");
        }
    </script>
</body>

</html>
