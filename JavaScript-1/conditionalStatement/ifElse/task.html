<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        // 1. compare two numbers and determine the largest one

        let a = 10, b = 5;
        if (a > b) {
            console.log("a is larger than b");
        } else {
            console.log("b is larger than a");
        }

        // 2. check the grade it is pass or fail

        let grade = 45;
        if (grade >= 50) {
            console.log("The person had a pass mark!");
        } else {
            console.log("The person had getting fail mark!");
        }

        // 3.Check the number is positive or negative

        let number = 30;
        if (number <= 0) {
            console.log("The number is positive!");
        } else {
            console.log("The number is negative!");
        }

        // 4. Check the weather it's morning or not

        let weather = "sunny and fresh";
        if (weather = "sunny and fresh") {
            console.log("It is morning!");
        } else {
            console.log("It is not a morning!");
        }

        // 5. Check the age to determine the adult or minor

        let age = 17;
        if (age >= 18) {
            console.log("The person is minor!");
        } else {
            console.log("The person is adult!");
        }

        // 6. Given number is zero or not...

        let num = 0;
        if (num === 0) {
            console.log("The number is zero!");
        } else {
            console.log("The number is not a zero!");
        }

        // 7. Determine the number is odd or even

        let numberIs = 20;
        if (numberIs % 2 === 0) {
            console.log("The number is even!");
        } else {
            console.log("The number is odd!");
        }

        // 8. Check the age for voting

        let voting = 16;
        if (voting >= 18) {
            console.log("The person is eligible for voting!");
        } else {
            console.log("The person is not eligible for voting!");
        }

        // 9. Verify if a string is empty or not

        let str = " ";
        if (str === " ") {
            console.log("This string is empty!");
        } else {
            console.log("The string is not empty!");

        }


    </script>
</body>

</html>
