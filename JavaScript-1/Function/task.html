        // 3. Using function add two numbers

        let b = 10, c = 20;

        function add() {
            console.log(b + c);

        }

        //4. Check the number is even

        let even = 22;

        function check() {
            if (even % 2 === 0) {
                console.log("The number is even");

            } else {
                console.log("Not even");

            }
        }
        check();

        // 5. Square a number using function

        let number = 10;

        function Square() {
            console.log(number * number);

        }
        Square();

        function find() {
            console.log(`Length: ${len.length}`);

        }
        find();

        }
        mul(2, 3)

        }
