<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        // 1. checking the two number...

        let a = 20, b = 30;
        console.log(a > 10 && b > 10);

        // 2. reverse the variable using !...

        let c = 10;
        console.log(!(c < a));

        // 3. check the two positive number...

        let d = 10, e = 10;
        console.log(d == e || e == d);

        // 4. check the number is between 10 and 20 using and(&) and or operator....

        let num = 19;
        console.log(num >= 10 || num <= 10);
        console.log(num >= 10 && num <= 10);

        // 5. convert the value into boolean using !...

        let bool = 10;
        console.log(!(bool < 5));


    </script>
</body>

</html>
