<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        // 1. check the number is less than or equal to another number....

        let num1 = 10;
        let num2 = 20;
        console.log(num1 <= num2);

        // 2. check the two different values using !=...

        let a = 10;
        let b = 20;
        console.log(!(a < b));

        // 3. check the greater number...

        let greater = 90;
        let greater1 = 50;
        console.log(greater > greater1);

        // 4.   check the lesser number...

        let lesser = 20;
        let lesser1 = 30;
        console.log(lesser < lesser1);

        // 5. using ===...

        let D = 5, A = "5";
        console.log(D === A);

        // 6. Check the number is greater than or equal to another number.....

        let great = 30, equ = 20;
        console.log(great >= equ);

        // 7. Check the value is not stricty eqaul...

        let r = 10;
        let s = 10;
        console.log(r !== s);

    </script>
</body>

</html>
