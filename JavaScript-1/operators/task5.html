<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

            //Increment age...
            let age=18;
            console.log(++age);
           
            let age1=18;
            age1++;
            a=age1;
            console.log(a);

            let age2=18;
            console.log(--age2);

            let age3=18;
            age3--;
            b=age3;
            console.log(b);          
            

            //decrement price 500...
            let price=500;
            console.log(++price);

            let price1=500;
            price1++;
            c=price1;
            console.log(c);

            let price2=500;
            console.log(--price2);
            
            let price3=500;
            price3--;
            d=price3;
            console.log(d);
            
    </script>
    
</body>
</html>
