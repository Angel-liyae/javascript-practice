<body>
    <script>

        //reverse the numbers in array...

        let arr = [33, 44, 55, 66, 77, 88, 99];
        let rev = arr.reverse();
        console.log(rev);

        //reverse the alphabets in array...

        let arr1 = ["a", "b", "c", "d", "z"];
        let rev1 = arr1.reverse();
        console.log(rev1);

        //reverse the words....

        let arr2 = ["z", , "to", , , "a"];
        let rev2 = arr2.reverse();
        console.log(rev2);

    </script>
</body>
