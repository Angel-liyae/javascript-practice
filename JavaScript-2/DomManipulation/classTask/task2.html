<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let a = document.createElement("p");
        a.setAttribute("class", "message");
        a.textContent = "This is first paragraph";

        let b = document.createElement("p");
        b.setAttribute("class", "message");
        b.textContent = "This is second paragraph";

        let c = document.createElement("p");
        c.setAttribute("class", "message");
        c.textContent = "This is third paragraph";

        let but = document.createElement("button");
        but.textContent = "Change Text";
        but.setAttribute("onclick", "change()");

        function change() {
            a.textContent = "update text";
            b.textContent = "update text";
            c.textContent = "update text";
        }

        document.body.append(a, b, c, but);





    </script>

</body>

</html>
