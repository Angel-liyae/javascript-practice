<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Counter</title>
</head>

<body>
    <script>
        let count = 0;
        let timer;

        timer = setInterval(() => {
            let line = document.createElement("p"); // create new line
            line.innerText = count;                 // put current count
            document.body.append(line);             // add to page

            if (count === 10) {
                clearInterval(timer); // stop at 10
            }
            count++;
        }, 1000);
    </script>
</body>

</html>
