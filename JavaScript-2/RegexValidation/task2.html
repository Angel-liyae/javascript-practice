<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const lab = document.createElement("label");
        lab.textContent = "Email:";

        const mail = document.createElement("input");

        const but = document.createElement("button");
        but.textContent = "Button";
        but.setAttribute("onclick", "fun()")

        function fun() {
            mail = /[a-zA-Z0-9]+\@[a-zA-Z]+\.[a-zA-Z]/;
            if (mail === mail) {
                alert("Valid email");
            } else {
                alert("Invalid email");
            }
             console.log(mail.test("user"));
            
        }
        document.body.append(lab, mail, but)

    </script>
</body>

</html>
